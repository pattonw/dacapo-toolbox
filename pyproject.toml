[project]
name = "dacapo-toolbox"
version = "1.0.0"
description = "A suite of tools for large scale ND training."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edt>=3.0.0",
    "funlib-persistence>=0.8.1",
    "gunpowder>=1.5.0",
    "scikit-learn>=1.7.1",
    "torch>=2.6.0",
]
[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
postprocessing = ["volara>=2.0.1", "volara-ml[torch]>=1.2.0"]
vis = ["matplotlib>=3.10.5", "scikit-image>=0.24", "scipy>=1.13"]
accelerators = ["accelerate>=1.10.0", "lightning>=2.5.3"]
sample-datasets = ["wget>=3.2"]
examples = ["torchvision>=0.22.0"]

[project.urls]
Documentation = "https://pattonw.github.io/dacapo-toolbox"
Source = "https://github.com/pattonw/dacapo-toolbox"
Issues = "https://github.com/pattonw/dacapo-toolbox/issues"

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff and ty versions come from uv.lock; `uv lock --upgrade` moves them.
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.3",
    "pytest-xdist>=3.6.1",
    "ty>=0.0.96",
]
docs = [
    "h5py>=3.13.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "mwatershed>=0.5.3",
    "tems>=1.0.3",
    "torchvision>=0.22.0",
    "volara>=2.0.1",
    "volara-ml[torch]>=1.2.0",
    "wget>=3.2",
    "jupytext>=1.17.2",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-click>=6.0",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9.7",
    "myst-parser>=4.0",
]

[tool.setuptools.package-data]
"dacapo_toolbox" = ["py.typed"]

[tool.ty.src]
include = ["src", "tests", "benchmarks"]
exclude = []  # only ever shrinks

[tool.ty.rules]
# torch.nn.Module declares `forward` as a Callable attribute; overriding it with a
# def trips invalid-mutable-override on every module. Recorded as a warning.
invalid-mutable-override = "warn"

[tool.ty.terminal]
# warn-level rules are recorded counters, not failures
error-on-warning = false

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["dacapo_toolbox"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 41
show_missing = true
skip_covered = true
