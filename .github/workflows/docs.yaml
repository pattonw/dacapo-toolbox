name: docs
on:
  # Rebuild after every benchmark run so the charts carry the newest point;
  # workflow_run fires on the default branch only.
  workflow_run:
    workflows: [benchmark]
    types: [completed]
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - uses: pandoc/actions/setup@v1
        with:
          version: 2.19
      - name: install ffmpeg
        run: sudo apt-get install ffmpeg
      - name: build docs
        run: just docs
      # The benchmark action keeps its data and dashboard on gh-pages; the
      # site is deployed from this artifact, so bring them along.
      - run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git checkout origin/gh-pages -- dev/bench 2>/dev/null; then
            mkdir -p docs/build/html/dev && mv dev/bench docs/build/html/dev/
          fi
      - name: Set permissions
        run: chmod -R a+rX ./docs/build/html
      - name: Update gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
