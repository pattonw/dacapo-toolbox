name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    env:
      # Every uv command in the job resolves the same way. With the mode given to
      # `uv sync` alone, the later `uv run` re-resolved to the newest versions and
      # the lowest-direct leg never tested the declared floors.
      UV_RESOLUTION: ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and newest
        python-version: ["3.12", "3.14"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          # lowest-direct on the newest interpreter: the torch 2.6 floor has no 3.14 wheels
          - python-version: "3.14"
            resolution: lowest-direct
        include:
          # the postprocessing extra pulls in numba, whose locked version has no 3.14 wheel
          - python-version: "3.12"
            extras: --extra postprocessing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra vis ${{ matrix.extras }}
      - name: tests
        run: |
          start=$(date +%s%N)
          uv run pytest --cov-report=xml
          echo "PYTEST_SECONDS=$(awk "BEGIN {print ($(date +%s%N) - $start) / 1e9}")" >> "$GITHUB_ENV"
      # The benchmark workflow publishes these numbers after this run completes.
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.12' && matrix.resolution == 'highest'
        run: uv run python benchmarks/run.py --pytest-seconds "$PYTEST_SECONDS" --pytest-command "uv run pytest --cov-report=xml"
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.12' && matrix.resolution == 'highest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmarks/output.json
      - uses: codecov/codecov-action@v5
