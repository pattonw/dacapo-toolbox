name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and newest
        python-version: ["3.12", "3.14"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          # lowest-direct on the newest interpreter: the torch 2.6 floor has no 3.14 wheels
          - python-version: "3.14"
            resolution: lowest-direct
        include:
          # the postprocessing extra pulls in numba, whose locked version has no 3.14 wheel
          - python-version: "3.12"
            extras: --extra postprocessing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra vis ${{ matrix.extras }} --resolution ${{ matrix.resolution }}
      - run: uv run pytest --cov-report=xml
      - uses: codecov/codecov-action@v5
